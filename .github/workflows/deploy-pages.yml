name: Deploy to GitHub Pages

# Publishes the built app to https://<owner>.github.io/<repo>/.
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source).
on:
  push:
    branches:
      - main
      - claude/daily-fantasy-contest-build-j8ym5x
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # The site is served from a subpath, so assets must be requested from
          # /<repo>/ rather than from the domain root.
          BASE_PATH: /FantasyContests/

      - name: Add SPA fallback
        # GitHub Pages has no rewrite rules, so a deep link such as
        # /FantasyContests/contest/abc would 404. Serving the app from 404.html
        # lets the router handle the URL instead.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the repository's Pages source is "Deploy from a branch", GitHub
      # also runs its own "pages build and deployment" on every push to main,
      # publishing the repository root — the unbuilt source — over this build.
      # Deploying after it finishes is what keeps the built site live.
      #
      # Setting Pages → Source to "GitHub Actions" stops that second build
      # entirely, at which point these two steps can be deleted.
      - name: Wait for the branch-based Pages build to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            running=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=30" \
              --jq '[.workflow_runs[]
                     | select(.path == "dynamic/pages/pages-build-deployment")
                     | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            if [ "$running" = "0" ]; then
              echo "No branch-based Pages build in flight."
              break
            fi
            echo "Branch-based Pages build still running (check $attempt)…"
            sleep 10
          done
          # Let its deployment settle before publishing over it.
          sleep 25

      - id: deployment
        uses: actions/deploy-pages@v4

      # Fail loudly rather than leave a blank page up: if the branch build won
      # anyway, the site is serving /src/main.tsx instead of the bundle.
      - name: Verify the built site is being served
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 12); do
            body=$(curl -sS --max-time 20 "$url" || true)
            if printf '%s' "$body" | grep -q 'assets/index-'; then
              echo "Built site is live at $url"
              exit 0
            fi
            echo "Still serving unbuilt source (check $attempt)…"
            sleep 15
          done
          echo "::error::GitHub Pages is serving the repository source, not this build. Set Settings -> Pages -> Source to 'GitHub Actions'."
          exit 1
