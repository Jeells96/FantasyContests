name: Deploy to GitHub Pages

# Publishes the built app to https://<owner>.github.io/<repo>/.
# The repository's Pages source must be "GitHub Actions"
# (Settings → Pages → Build and deployment → Source); on "Deploy from a branch"
# GitHub publishes the repository root over this build and the page renders
# blank, which the verification step at the end catches.
on:
  push:
    branches:
      - main
      - claude/daily-fantasy-contest-build-j8ym5x
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # The site is served from a subpath, so assets must be requested from
          # /<repo>/ rather than from the domain root.
          BASE_PATH: /FantasyContests/

      - name: Add SPA fallback
        # GitHub Pages has no rewrite rules, so a deep link such as
        # /FantasyContests/contest/abc would 404. Serving the app from 404.html
        # lets the router handle the URL instead.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Cheap safety net: confirm the bundle is actually being served rather
      # than the repository source, which is what a misconfigured Pages source
      # produces — a blank page with no other warning.
      - name: Verify the built site is being served
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for attempt in $(seq 1 12); do
            body=$(curl -sS --max-time 20 "$url" || true)
            if printf '%s' "$body" | grep -q 'assets/index-'; then
              echo "Built site is live at $url"
              exit 0
            fi
            echo "Still serving unbuilt source (check $attempt)…"
            sleep 15
          done
          echo "::error::GitHub Pages is serving the repository source, not this build. Check Settings -> Pages -> Source is 'GitHub Actions'."
          exit 1
