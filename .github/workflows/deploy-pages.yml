name: Deploy to GitHub Pages

# Publishes the built app to https://<owner>.github.io/<repo>/.
# Requires the repository's Pages source to be set to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source).
on:
  push:
    branches:
      - main
      - claude/daily-fantasy-contest-build-j8ym5x
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # The site is served from a subpath, so assets must be requested from
          # /<repo>/ rather than from the domain root.
          BASE_PATH: /FantasyContests/

      - name: Add SPA fallback
        # GitHub Pages has no rewrite rules, so a deep link such as
        # /FantasyContests/contest/abc would 404. Serving the app from 404.html
        # lets the router handle the URL instead.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the repository's Pages source is "Deploy from a branch", GitHub
      # also runs its own "pages build and deployment" on every push to main,
      # which publishes the repository root — the unbuilt source — over this
      # build. Waiting lets that finish so the built site is what ends up live.
      #
      # Setting Pages → Source to "GitHub Actions" stops that second build
      # entirely, at which point this step can be deleted.
      - name: Let the branch-based Pages build finish first
        run: sleep 90

      - id: deployment
        uses: actions/deploy-pages@v4
